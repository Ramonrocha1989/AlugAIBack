openapi: 3.0.3
info:
  title: BaitaBriq API
  version: 1.0.0
  description: API B2B para compra, venda e propostas de maquinas entre empresas.

servers:
  - url: http://localhost:3000/api
    description: Desenvolvimento

tags:
  - name: auth
  - name: users
  - name: companies
  - name: machines
  - name: proposals
  - name: favorites
  - name: reviews
  - name: notifications
  - name: plans
  - name: subscriptions
  - name: verification
  - name: analytics
  - name: categories
  - name: settings
  - name: admin
  - name: health
  - name: metrics
  - name: webhooks
  - name: images

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string

    GenericMessageResponse:
      type: object
      properties:
        message:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    RegisterDto:
      type: object
      required: [email, password, userType, phone]
      example:
        email: contato@empresa.com
        password: SenhaForte123
        userType: COMPANY
        companyName: Agro Rocha Ltda
        responsibleName: Ramon Rocha
        cnpj: "12345678000195"
        phone: "51999887766"
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Deve conter maiuscula, minuscula e numero.
        userType:
          type: string
          enum: [INDIVIDUAL, COMPANY]
        fullName:
          type: string
        cpf:
          type: string
        companyName:
          type: string
        cnpj:
          type: string
        responsibleName:
          type: string
        phone:
          type: string
          pattern: "^\\d{10,11}$"

    LoginDto:
      type: object
      required: [email, password]
      example:
        email: contato@empresa.com
        password: SenhaForte123
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UpgradePlanDto:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, lojista]
        userId:
          type: string
          format: uuid

    ForgotPasswordDto:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordDto:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    VerifyEmailDto:
      type: object
      required: [token]
      properties:
        token:
          type: string

    UpdateAuthProfileDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          pattern: "^\\d{10,11}$"

    RequestDeleteDto:
      type: object
      required: [password]
      properties:
        password:
          type: string

    ConfirmDeleteDto:
      type: object
      required: [token]
      properties:
        token:
          type: string

    CreateMachineDto:
      type: object
      required:
        - businessType
        - name
        - description
        - category
        - manufacturer
        - model
        - yearModel
        - price
        - state
        - city
        - images
      example:
        businessType: SALE
        name: Trator John Deere 6110J 2022
        description: Trator em excelente estado, revisoes em dia, pneus novos e pronto para trabalho pesado no campo.
        category: tratores
        manufacturer: John Deere
        model: 6110J
        yearModel: 2022
        power: 110
        engineHours: 2300
        price: 420000
        acceptsTradeDown: false
        acceptsTradeUp: true
        acceptsGrains: false
        acceptsFinancing: true
        state: RS
        city: Porto Alegre
        images:
          - https://res.cloudinary.com/demo/image/upload/trator-frente.jpg
          - https://res.cloudinary.com/demo/image/upload/trator-lateral.jpg
        quickTags:
          - NEW_TIRES
          - COMPLETE_DOCS
      properties:
        businessType:
          type: string
          enum: [SALE, RENTAL, EXCHANGE, SERVICE]
        name:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          minLength: 50
          maxLength: 5000
        category:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        yearModel:
          type: integer
          minimum: 1980
        power:
          type: number
          minimum: 0
        engineHours:
          type: integer
          minimum: 0
        serialNumber:
          type: string
        price:
          type: number
          minimum: 0.01
        acceptsTradeDown:
          type: boolean
        acceptsTradeUp:
          type: boolean
        acceptsGrains:
          type: boolean
        acceptsFinancing:
          type: boolean
        state:
          type: string
          minLength: 2
          maxLength: 2
        city:
          type: string
        zipCode:
          type: string
          pattern: "^\\d{8}$"
        images:
          type: array
          minItems: 1
          maxItems: 15
          items:
            type: string
            format: uri
        videoUrl:
          type: string
          format: uri
        quickTags:
          type: array
          items:
            type: string
            enum:
              - NEW_TIRES
              - ORIGINAL_CABIN
              - AUTHORIZED_SERVICE
              - GPS_INTEGRATED
              - AIR_CONDITIONING
              - SINGLE_OWNER
              - COMPLETE_DOCS
        ownerPhone:
          type: string
          pattern: "^\\d{10,11}$"

    UpdateMachineDto:
      allOf:
        - $ref: '#/components/schemas/CreateMachineDto'
        - type: object
          properties:
            isPremium:
              type: boolean
            isFeatured:
              type: boolean
            available:
              type: boolean
            status:
              type: string
              enum: [ACTIVE, SOLD, INACTIVE]

    CreateProposalDto:
      type: object
      required: [machineId, proposedPrice, message]
      example:
        machineId: 9f1c8c8f-9b63-4b11-8e9f-0fcd662ca01a
        proposedPrice: 395000
        message: Tenho interesse imediato e posso fechar ainda esta semana.
      properties:
        machineId:
          type: string
          format: uuid
        proposedPrice:
          type: number
          minimum: 0.01
        message:
          type: string
          minLength: 10
          maxLength: 1000

    CounterProposalDto:
      type: object
      required: [counterPrice, counterMessage]
      example:
        counterPrice: 405000
        counterMessage: Consigo reduzir para este valor com pagamento a vista.
      properties:
        counterPrice:
          type: number
          minimum: 0.01
        counterMessage:
          type: string
          minLength: 10
          maxLength: 1000

    AddFavoriteDto:
      type: object
      required: [machineId]
      properties:
        machineId:
          type: string
          format: uuid

    CreateReviewDto:
      type: object
      required: [reviewedUserId, rating]
      properties:
        reviewedUserId:
          type: string
          format: uuid
        machineId:
          type: string
          format: uuid
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true

    UpdateReviewDto:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true

    UpdateUserProfileDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          pattern: "^\\d{10,11}$"

    UpdateCompanyProfileDto:
      type: object
      properties:
        description:
          type: string
        phone:
          type: string
        location:
          type: string
        website:
          type: string
        logo:
          type: string
        banner:
          type: string
        businessHours:
          type: string
        categoriesWorked:
          type: array
          items:
            type: string
        gallery:
          type: array
          items:
            type: string

    RequestVerificationDto:
      type: object
      required: [documentType, documentNumber, companyName, phone, email]
      properties:
        documentType:
          type: string
          enum: [CPF, CNPJ]
        documentNumber:
          type: string
        companyName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        reason:
          type: string

    RejectVerificationDto:
      type: object
      properties:
        reason:
          type: string

    BanUserDto:
      type: object
      required: [isBanned]
      properties:
        isBanned:
          type: boolean

    VerifySellerDto:
      type: object
      required: [isVerifiedSeller]
      properties:
        isVerifiedSeller:
          type: boolean

    UpdateMachineStatusDto:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, PENDING, REJECTED]

    FeatureMachineDto:
      type: object
      required: [isFeatured]
      properties:
        isFeatured:
          type: boolean

    UpdateSettingsDto:
      type: object
      properties:
        siteName:
          type: string
        homeTitle:
          type: string
        homeDescription:
          type: string
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: string
        whatsappSupport:
          type: string
        phoneSupport:
          type: string
        emailSupport:
          type: string
        socialLinks:
          type: object
          properties:
            instagram:
              type: string
            facebook:
              type: string
            youtube:
              type: string
            linkedin:
              type: string
        termsOfUse:
          type: string
        privacyPolicy:
          type: string

    CreateBannerDto:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          format: uri
        link:
          type: string
        active:
          type: boolean

    UpdateUserPlanDto:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, basico, profissional, premium]
        expiresAt:
          type: string
          format: date-time
          nullable: true

    CreateCategoryDto:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        isActive:
          type: boolean

    UpdateCategoryDto:
      allOf:
        - $ref: '#/components/schemas/CreateCategoryDto'

    ReorderCategoryDto:
      type: object
      required: [order]
      properties:
        order:
          type: integer
          minimum: 0

    UpdatePlanDto:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          minimum: 0
        maxAds:
          type: integer
          minimum: 0
        maxPhotos:
          type: integer
          minimum: 0
        maxVideos:
          type: integer
          minimum: 0
        adDuration:
          type: integer
          minimum: 0
        maxPremiumAds:
          type: integer
          minimum: 0
        maxFeaturedAds:
          type: integer
          minimum: 0
        hasAnalytics:
          type: boolean
        analyticsLevel:
          type: string
        hasPriority:
          type: boolean
        hasStorePage:
          type: boolean
        hasVerifiedBadge:
          type: boolean
        supportLevel:
          type: string
        isActive:
          type: boolean

paths:
  /auth/health:
    get:
      tags: [auth]
      summary: Health check do modulo auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [auth]
      summary: Registrar empresa e usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
            examples:
              empresa:
                value:
                  email: contato@empresa.com
                  password: SenhaForte123
                  userType: COMPANY
                  companyName: Agro Rocha Ltda
                  responsibleName: Ramon Rocha
                  cnpj: "12345678000195"
                  phone: "51999887766"
      responses:
        '201':
          description: Criado
          content:
            application/json:
              examples:
                sucesso:
                  value:
                    message: Cadastro realizado com sucesso
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 7d902d9f-8c4d-4f7e-9065-693ab35fcfad
                      email: contato@empresa.com
                      role: COMPANY
        '400':
          description: Erro de validacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            examples:
              padrao:
                value:
                  email: contato@empresa.com
                  password: SenhaForte123
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                sucesso:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 7d902d9f-8c4d-4f7e-9065-693ab35fcfad
                      email: contato@empresa.com
                      role: COMPANY

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
            examples:
              body:
                value:
                  refreshToken: sample-refresh-token
      responses:
        '200':
          description: OK

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Solicitar reset de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
            examples:
              body:
                value:
                  email: contato@empresa.com
      responses:
        '200':
          description: OK

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Resetar senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
            examples:
              body:
                value:
                  token: reset-token-exemplo
                  password: NovaSenha123
      responses:
        '200':
          description: OK

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verificar email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailDto'
            examples:
              body:
                value:
                  token: verify-token-exemplo
      responses:
        '200':
          description: OK

  /auth/me:
    get:
      tags: [auth]
      summary: Usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /auth/upgrade-plan:
    post:
      tags: [auth]
      summary: Upgrade de plano (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradePlanDto'
            examples:
              body:
                value:
                  plan: lojista
                  userId: 7d902d9f-8c4d-4f7e-9065-693ab35fcfad
      responses:
        '200':
          description: OK

  /auth/profile:
    put:
      tags: [auth]
      summary: Atualizar perfil do usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthProfileDto'
            examples:
              body:
                value:
                  name: Ramon Rocha
                  phone: "51999887766"
      responses:
        '200':
          description: OK

  /auth/request-delete:
    post:
      tags: [auth]
      summary: Solicitar exclusao da conta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeleteDto'
            examples:
              body:
                value:
                  password: SenhaForte123
      responses:
        '200':
          description: OK

  /auth/confirm-delete:
    post:
      tags: [auth]
      summary: Confirmar exclusao da conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDeleteDto'
            examples:
              body:
                value:
                  token: delete-token-exemplo
      responses:
        '200':
          description: OK

  /users/me:
    get:
      tags: [users]
      summary: Obter meu perfil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    put:
      tags: [users]
      summary: Atualizar meu perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDto'
            examples:
              body:
                value:
                  name: Ramon Rocha
                  phone: "51999887766"
      responses:
        '200':
          description: OK

  /companies/me:
    get:
      tags: [companies]
      summary: Perfil da minha empresa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /companies/profile:
    put:
      tags: [companies]
      summary: Atualizar perfil da empresa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyProfileDto'
            examples:
              body:
                value:
                  description: Especialistas em tratores e colheitadeiras.
                  phone: "51999887766"
                  location: Porto Alegre - RS
                  website: https://agro-rocha.com.br
                  businessHours: Seg-Sex 08:00-18:00
      responses:
        '200':
          description: OK

  /companies/{id}:
    get:
      tags: [companies]
      summary: Perfil publico da empresa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /companies/{id}/machines:
    get:
      tags: [companies]
      summary: Maquinas da empresa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /machines:
    get:
      tags: [machines]
      summary: Listar maquinas
      responses:
        '200':
          description: OK
    post:
      tags: [machines]
      summary: Criar maquina
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineDto'
            examples:
              trator:
                value:
                  businessType: SALE
                  name: Trator John Deere 6110J 2022
                  description: Trator em excelente estado, revisoes em dia, pneus novos e pronto para trabalho pesado no campo.
                  category: tratores
                  manufacturer: John Deere
                  model: 6110J
                  yearModel: 2022
                  power: 110
                  engineHours: 2300
                  price: 420000
                  acceptsTradeDown: false
                  acceptsTradeUp: true
                  acceptsGrains: false
                  acceptsFinancing: true
                  state: RS
                  city: Porto Alegre
                  images:
                    - https://res.cloudinary.com/demo/image/upload/trator-frente.jpg
                    - https://res.cloudinary.com/demo/image/upload/trator-lateral.jpg
                  quickTags:
                    - NEW_TIRES
                    - COMPLETE_DOCS
      responses:
        '201':
          description: Criado
          content:
            application/json:
              examples:
                criado:
                  value:
                    id: 0a7ef269-a8b1-4526-9802-2d7f8e5d4a57
                    name: Trator John Deere 6110J 2022
                    status: ACTIVE
                    createdAt: "2026-04-30T18:30:00.000Z"

  /machines/my:
    get:
      tags: [machines]
      summary: Listar minhas maquinas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /machines/{id}:
    get:
      tags: [machines]
      summary: Buscar maquina por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      tags: [machines]
      summary: Atualizar maquina
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineDto'
            examples:
              body:
                value:
                  price: 410000
                  description: Maquina revisada, pronta para entrega imediata.
                  status: ACTIVE
      responses:
        '200':
          description: OK
    delete:
      tags: [machines]
      summary: Deletar maquina
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /machines/{id}/view:
    post:
      tags: [machines]
      summary: Registrar visualizacao
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /machines/{id}/track-whatsapp:
    post:
      tags: [machines]
      summary: Registrar clique WhatsApp
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /machines/{id}/mark-lead:
    post:
      tags: [machines]
      summary: Marcar lead qualificado
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /proposals:
    get:
      tags: [proposals]
      summary: Listar propostas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [proposals]
      summary: Criar proposta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalDto'
            examples:
              proposta:
                value:
                  machineId: 9f1c8c8f-9b63-4b11-8e9f-0fcd662ca01a
                  proposedPrice: 395000
                  message: Tenho interesse imediato e posso fechar ainda esta semana.
      responses:
        '201':
          description: Criado
          content:
            application/json:
              examples:
                criada:
                  value:
                    id: 64cd36e2-90db-4618-b6b9-14395aef95e5
                    status: PENDING
                    proposedPrice: 395000

  /proposals/{id}/accept:
    patch:
      tags: [proposals]
      summary: Aceitar proposta
      security:
        - bearerAuth: []
      parameters:
        - in: path
